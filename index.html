<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <title>Login - Phone Price Prediction</title>
      <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Glowing Background Elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="auth-container">
      <!-- Left Side -->
      <div class="auth-left">
        <div class="brand-logo" style="margin-bottom: 2rem;">
          <!-- SVG Logo Placeholder -->
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="url(#paint0_linear)" />
            <path d="M12 6V18M6 12H18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="paint0_linear" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7C3AED" />
                <stop offset="1" stop-color="#3B82F6" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="brand-title">Phone Price Prediction</h1>
        <p class="brand-desc">AI Powered Mobile Price Prediction Platform</p>
        
        <div class="bottom-copy">
          &copy; 2026 Phone Price Prediction
        </div>
      </div>

      <!-- Right Side -->
      <div class="auth-right">
        <div class="glass-card auth-card">
          <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue</p>
          </div>

          <form id="loginForm" action="/dashboard.html">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" class="form-control" placeholder="Enter your email" value="test@example.com" required />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" class="form-control" placeholder="Enter your password" value="password123" required />
              <i class="fa-solid fa-eye password-toggle" id="togglePassword"></i>
            </div>

            <div class="flex justify-between items-center" style="margin-bottom: 1.5rem;">
              <div class="checkbox-group">
                <input type="checkbox" id="remember" />
                <label for="remember">Remember Me</label>
              </div>
              <a href="#" style="font-size: 0.875rem;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-bottom: 1.5rem;">Sign In</button>

            <div class="auth-footer">
              <span style="color: var(--text-secondary);">Don't have an account?</span>
              <a href="/register.html" style="font-weight: 600; margin-left: 0.5rem;">Register</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });
          
          const data = await response.json();
          if (data.success) {
            localStorage.setItem('userFullname', data.fullname);
            window.location.href = '/dashboard.html';
          } else {
            alert(data.error || 'Login failed');
          }
        } catch (err) {
          console.error(err);
          alert('Failed to connect to server');
        }
      });
    </script>
  </body>
</html>
