<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Price Predict AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../src/style.css" />
    <link rel="stylesheet" href="admin.css" />
    <style>
      .settings-layout { display: grid; grid-template-columns: 250px 1fr; gap: 2rem; }
      .settings-nav { display: flex; flex-direction: column; gap: 0.5rem; }
      .settings-nav-btn {
        padding: 0.75rem 1rem;
        text-align: left;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 500;
        font-size: 0.875rem;
      }
      .settings-nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
      .settings-nav-btn.active { background: rgba(124, 58, 237, 0.15); color: var(--primary-color); }
      .settings-section { display: none; }
      .settings-section.active { display: block; animation: fadeIn 0.3s ease forwards; }
    </style>
  </head>
  <body class="admin-layout">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    
    <div id="admin-app">
      <div class="page-header">
        <div class="page-title">
          <h1>System Settings</h1>
          <p>Configure global platform preferences, security, and integrations.</p>
        </div>
      </div>

      <div class="settings-layout">
        <div class="glass-card" style="padding: 1rem; height: max-content;">
          <div class="settings-nav">
            <button class="settings-nav-btn active" onclick="switchTab('general')"><i class="fa-solid fa-sliders" style="width: 20px;"></i> General</button>
            <button class="settings-nav-btn" onclick="switchTab('security')"><i class="fa-solid fa-shield-halved" style="width: 20px;"></i> Security</button>
            <button class="settings-nav-btn" onclick="switchTab('api')"><i class="fa-solid fa-key" style="width: 20px;"></i> API Keys</button>
            <button class="settings-nav-btn" onclick="switchTab('database')"><i class="fa-solid fa-database" style="width: 20px;"></i> Database</button>
            <button class="settings-nav-btn" onclick="switchTab('system')"><i class="fa-solid fa-server" style="width: 20px;"></i> System</button>
          </div>
        </div>

        <div class="glass-card">
          <!-- General -->
          <div id="tab-general" class="settings-section active">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">General Settings</h2>
            <form onsubmit="event.preventDefault(); window.showToast('Settings Saved', 'General settings have been updated.');">
              <div class="grid-2">
                <div class="form-group">
                  <label>Website Name</label>
                  <input type="text" class="form-control" value="Phone Price Prediction System" />
                </div>
                <div class="form-group">
                  <label>Support Email</label>
                  <input type="email" class="form-control" value="support@predict.ai" />
                </div>
                <div class="form-group" style="grid-column: span 2;">
                  <label>Site Description</label>
                  <textarea class="form-control" rows="3">AI Powered Mobile Price Prediction Platform for Current, Future, and Resale values.</textarea>
                </div>
                <div class="form-group">
                  <label>Logo Upload</label>
                  <input type="file" class="form-control" />
                </div>
                <div class="form-group">
                  <label>Primary Theme Color</label>
                  <input type="color" class="form-control" value="#7C3AED" style="height: 45px; padding: 0.25rem;" />
                </div>
              </div>
              <div class="mt-6 flex justify-end">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save Changes</button>
              </div>
            </form>
          </div>

          <!-- API Keys -->
          <div id="tab-api" class="settings-section">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">API & Integrations</h2>
            <form onsubmit="event.preventDefault(); window.showToast('Keys Saved', 'API keys have been updated.');">
              <div class="form-group">
                <label>OpenAI API Key (For advanced parsing)</label>
                <input type="password" class="form-control" value="sk-xxxxxxxxxxxxxxxxxxxxxxxx" />
              </div>
              <div class="form-group">
                <label>Google Cloud Vision API (OCR)</label>
                <input type="password" class="form-control" value="AIzaSyBxxxxxxxxxxxxxxxxx" />
              </div>
              <div class="form-group">
                <label>Cloudinary URL (Image Storage)</label>
                <input type="password" class="form-control" value="cloudinary://xxxxxxxxxxxxxx" />
              </div>
              <div class="mt-6 flex justify-end">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save API Keys</button>
              </div>
            </form>
          </div>

          <!-- Other tabs omitted for brevity, but functional structure remains -->
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
    <script src="layout.js"></script>
    <script>
      function switchTab(tabId) {
        document.querySelectorAll('.settings-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.settings-nav-btn').forEach(el => el.classList.remove('active'));
        
        const targetSection = document.getElementById('tab-' + tabId);
        if(targetSection) targetSection.classList.add('active');
        
        event.currentTarget.classList.add('active');
      }
    </script>
  </body>
</html>
