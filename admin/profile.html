<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Price Predict AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../src/style.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-layout">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    
    <div id="admin-app">
      <div class="page-header">
        <div class="page-title">
          <h1>Admin Profile</h1>
          <p>Manage your personal information and security.</p>
        </div>
      </div>

      <div class="grid-2" style="grid-template-columns: 1fr 2fr;">
        <!-- Profile Card -->
        <div class="glass-card text-center">
          <div style="position: relative; display: inline-block; margin-bottom: 1.5rem;">
            <img src="https://ui-avatars.com/api/?name=Admin+User&background=7C3AED&color=fff&size=120" style="border-radius: 50%; border: 4px solid var(--card-bg);" />
            <button class="btn btn-primary" style="position: absolute; bottom: 0; right: 0; width: 36px; height: 36px; padding: 0; border-radius: 50%;"><i class="fa-solid fa-camera"></i></button>
          </div>
          <h2 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Admin User</h2>
          <p class="text-secondary" style="margin-bottom: 1rem;">Super Administrator</p>
          
          <div class="flex-col gap-2 text-left mt-6 pt-6" style="border-top: 1px solid var(--border-color);">
            <div class="flex justify-between">
              <span class="text-secondary"><i class="fa-solid fa-envelope w-4"></i> Email</span>
              <span class="text-main">admin@predict.ai</span>
            </div>
            <div class="flex justify-between">
              <span class="text-secondary"><i class="fa-solid fa-phone w-4"></i> Phone</span>
              <span class="text-main">+1 234 567 890</span>
            </div>
            <div class="flex justify-between">
              <span class="text-secondary"><i class="fa-solid fa-location-dot w-4"></i> Location</span>
              <span class="text-main">Toronto, Canada</span>
            </div>
          </div>
        </div>

        <!-- Edit Form -->
        <div class="glass-card">
          <h3 style="margin-bottom: 1.5rem;">Update Information</h3>
          <form onsubmit="event.preventDefault(); window.showToast('Profile Updated', 'Your profile details have been saved.');">
            <div class="grid-2">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" value="Admin" />
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" value="User" />
              </div>
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" value="admin@predict.ai" />
              </div>
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" class="form-control" value="+1 234 567 890" />
              </div>
            </div>
            <div class="flex justify-end mt-4">
              <button type="submit" class="btn btn-primary">Save Details</button>
            </div>
          </form>

          <h3 style="margin-bottom: 1.5rem; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">Change Password</h3>
          <form onsubmit="event.preventDefault(); window.showToast('Password Updated', 'Your password has been changed successfully.');">
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" class="form-control" placeholder="Enter current password" />
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label>New Password</label>
                <input type="password" class="form-control" placeholder="Enter new password" />
              </div>
              <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm new password" />
              </div>
            </div>
            <div class="flex justify-end mt-4">
              <button type="submit" class="btn btn-blue">Update Password</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
    <script src="layout.js"></script>
  </body>
</html>
